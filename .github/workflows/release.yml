name: Android Release CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v3.0.0; optional if triggering directly from a tag)'
        required: false
        type: string
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Cache NDK and CMake
        id: cache-ndk-cmake
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: ndk-27.0.12077973-cmake-3.22.1

      - name: Install NDK and CMake via SDK Manager
        if: steps.cache-ndk-cmake.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore for Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Release keystore detected. Decoding..."
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "SIGNING_CONFIGURED=true" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret provided. Release will be built unsigned."
            echo "SIGNING_CONFIGURED=false" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK and App Bundle
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Generate Checksums
        run: |
          mkdir -p release-dist
          cp app/build/outputs/apk/release/*.apk release-dist/ 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab release-dist/ 2>/dev/null || true
          cd release-dist
          sha256sum * > ../checksums.txt
          cd ..
          echo "Generated SHA-256 Checksums:"
          cat checksums.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-artifacts
          path: |
            release-dist/*
            checksums.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Determine Release Tag
        id: release-tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.release-tag.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: |
            release-dist/*
            checksums.txt
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
